<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StockDigest - Tin Chứng Khoán AI</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
<div class="container py-5">
    <h1 class="text-center text-white mb-4 text-shadow">StockDigest</h1>
    <p class="text-center text-white mb-5 fs-4">Tin chứng khoán tóm tắt bằng AI</p>

    <!-- PHẦN NHẬP MÃ + EMAIL MỚI -->
    <div class="card mb-5 shadow-lg">
        <div class="card-body">
            <!-- Nhập mã chứng khoán -->
            <div class="input-group input-group-lg mb-3">
                <input type="text" id="codes" class="form-control fs-5" placeholder="VD: VCB HPG FPT USD FTSE">
                <button class="btn btn-danger btn-lg px-5" onclick="save()">Theo dõi ngay</button>
            </div>

            <!-- Nhập email nhận tin sáng/tối -->
            <div class="input-group input-group-lg mb-3">
                <span class="input-group-text bg-white border-end-0">Email nhận tin mỗi sáng/tối</span>
                <input type="email" id="email" class="form-control border-start-0" placeholder="you@gmail.com">
                <button class="btn btn-success btn-lg px-5" onclick="saveEmail()">Lưu Email</button>
            </div>

            <!-- Hiển thị trạng thái -->
            <div class="fs-5">
                <strong>Đang theo dõi mã:</strong>
                <span id="list" class="text-danger fw-bold">Chưa có mã nào</span>
                <br><br>
                <strong>Email nhận tin:</strong>
                <span id="email-display" class="text-success fw-bold">Chưa đặt</span>
            </div>
        </div>
    </div>

    <div id="news" class="row row-cols-1 g-4"></div>

    <div id="alert" class="alert alert-danger text-center fixed-top d-none shadow-lg"
         style="top: 20px; left: 50%; transform: translateX(-50%); z-index: 9999;">
        <h4 class="mb-0">TIN NÓNG VỪA CÓ!</h4>
    </div>
</div>

<script>
function save() {
    const input = document.getElementById('codes').value.trim().toUpperCase();
    if (!input) return;
    const codes = input.split(/\s+/).filter(Boolean);
    localStorage.setItem('watchlist', codes.join(','));
    document.getElementById('list').textContent = codes.join(' ');
    load(); // reload ngay
}

function load() {
    const watchlist = localStorage.getItem('watchlist') || '';
    document.getElementById('list').textContent = watchlist || 'Chưa có mã nào';

    fetch(`/api/news?watchlist=${watchlist}`)
        .then(res => res.json())
        .then(data => {
            const container = document.getElementById('news');
            container.innerHTML = '';

            data.forEach(item => {
                const card = document.createElement('div');
                card.className = `card mb-3 shadow-lg ${item.is_hot ? 'border-danger border-5' : 'border-light'}`;

                card.innerHTML = `
                    <div class="card-body">
                        ${item.is_hot ? '<h3 class="text-danger fw-bold mb-3">🔥 TIN NÓNG CHO BẠN!</h3>' : ''}
                        <h5 class="card-title">${item.title}</h5>
                        <p class="card-text">${item.summary.replace(/\n/g, '<br>')}</p>
                        <div class="d-flex justify-content-between align-items-center mt-3">
                            <a href="${item.url}" target="_blank" class="btn btn-${item.is_hot ? 'danger' : 'primary'} btn-lg">
                                ${item.is_hot ? 'ĐỌC NGAY' : 'Xem thêm'}
                            </a>
                            <div class="text-end">
                                <small class="text-muted">Mã liên quan:</small><br>
                                ${item.codes.map(code =>
                                    item.matched_codes.includes(code)
                                    ? `<span class="badge bg-danger fs-6 mx-1">${code}</span>`
                                    : `<span class="badge bg-secondary mx-1">${code}</span>`
                                ).join('')}
                            </div>
                        </div>
                    </div>
                `;
                container.appendChild(card);
            });
        })
        .catch(err => console.error('Lỗi:', err));
}

setInterval(load, 40000);
load();
</script>
</body>
</html>
